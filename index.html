<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page setup -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something New Is Coming - ASVA Innovation Lab</title>

  <!-- Website Favicon -->
  <link rel="icon" type="image/jpeg" href="logo.jpg" />

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Link to external CSS stylesheet -->
  <link rel="stylesheet" href="main.css" />
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <a href="#" class="logo-link" title="ASVA Innovation Lab">
      <span class="logo-text">ASVA</span>
    </a>

    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation menu" aria-expanded="false" type="button">
      <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <nav class="site-nav" id="siteNav" aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#services">Services</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
      <a href="#careers">Careers</a>
      <a href="#blog">Blogs</a>
    </nav>
  </header>

  <!-- Main Centered Stage -->
  <main class="container" id="home">
    
    <!-- Under Construction Label (Text Only) -->
    <div class="construction-label-wrap">
      <span class="construction-text">UNDER CONSTRUCTION</span>
    </div>

    <!-- Main Heading -->
    <h1 class="main-heading">SOMETHING NEW IS COMING</h1>

    <!-- Subtitle Message -->
    <p class="subtitle">
      We're crafting something extraordinary. Stay tuned!
    </p>

    <!-- Contact & Gmail Section -->
    <div class="contact-card-wrap">
      <a 
        href="https://mail.google.com/mail/?view=cm&fs=1&to=info@asva.com.np" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="contact-pill" 
        title="Send email via Gmail"
      >
        <span class="contact-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
        </span>
        <span class="contact-text">
          <span class="contact-prefix">Contact:</span>
          <span class="contact-email">info@asva.com.np</span>
        </span>
      </a>
    </div>
  </main>

  <!-- Copyright Footer -->
  <footer class="footer">
    <p>&copy; 2026 ASVA Innovation Lab Pvt. Ltd. All Rights Reserved.</p>
  </footer>

  <!-- Mobile Navigation Toggle Script -->
  <script>
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const siteNav = document.getElementById('siteNav');

    if (mobileMenuBtn && siteNav) {
      mobileMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = siteNav.classList.toggle('is-open');
        mobileMenuBtn.classList.toggle('is-active', isOpen);
        mobileMenuBtn.setAttribute('aria-expanded', String(isOpen));
      });

      // Close menu when clicking any nav link
      siteNav.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          siteNav.classList.remove('is-open');
          mobileMenuBtn.classList.remove('is-active');
          mobileMenuBtn.setAttribute('aria-expanded', 'false');
        });
      });

      // Close menu when clicking outside
      document.addEventListener('click', (e) => {
        if (!siteNav.contains(e.target) && !mobileMenuBtn.contains(e.target)) {
          siteNav.classList.remove('is-open');
          mobileMenuBtn.classList.remove('is-active');
          mobileMenuBtn.setAttribute('aria-expanded', 'false');
        }
      });
    }
  </script>

</body>
</html>
