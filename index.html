<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page setup -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something New Is Coming - ASVA Innovation Lab</title>

  <!-- Website Favicon -->
  <link rel="icon" type="image/jpeg" href="logo.jpg" />

  <!-- Google Fonts: Montserrat & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Link to external CSS stylesheet -->
  <link rel="stylesheet" href="main.css" />
</head>
<body>

  <!-- Main Centered Stage -->
  <main class="container">

    <!-- Company Logo Centered in Stage -->
    <header class="logo-container">
      <a href="#" class="logo-link" title="ASVA Innovation Lab">
        <img src="logo.png" alt="ASVA Innovation Lab" class="logo" />
      </a>
    </header>
    
    <!-- Under Construction Label (White Text) -->
    <div class="construction-label-wrap">
      <span class="construction-text">UNDER CONSTRUCTION</span>
    </div>

    <!-- Main Heading -->
    <h1 class="main-heading">SOMETHING NEW IS COMING</h1>

    <!-- Subtitle Message -->
    <p class="subtitle">
      We're crafting something extraordinary. Stay tuned!
    </p>

    <!-- Contact & Gmail Section -->
    <div class="contact-card-wrap">
      <a 
        href="https://mail.google.com/mail/?view=cm&fs=1&to=info@asva.com.np" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="contact-pill" 
        title="Send email via Gmail"
      >
        <span class="contact-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
        </span>
        <span class="contact-text">
          <span class="contact-prefix">Contact:</span>
          <span class="contact-email">info@asva.com.np</span>
        </span>
      </a>
    </div>

    <!-- Copyright Footer -->
    <footer class="footer">
      <p>&copy; 2026 ASVA Innovation Lab Pvt. Ltd. All Rights Reserved.</p>
    </footer>

  </main>

</body>
</html>
